name: Validate lexicon

on:
  pull_request:
    paths:
      - "lexicons/**"
      - ".github/workflows/ci.yml"

# Allow only one concurrent check run per pull request. A newer push cancels the
# in-progress run, since only the checks for the latest commit matter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      finished: ${{ steps.lint.outcome == 'success' || steps.lint.outcome == 'failure' || steps.breaking.outcome == 'success' || steps.breaking.outcome == 'failure' || steps.breaking.outcome == 'success' || steps.breaking.outcome == 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install goat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo bluesky-social/goat --pattern 'goat_Linux_x86_64.tar.gz' --output 'goat.tar.gz'
          tar -xzf goat.tar.gz --directory /usr/local/bin
          chmod +x /usr/local/bin/goat

      - name: Print goat version
        continue-on-error: false
        run: goat -v

      - run: mkdir -p logs

      # We capture stderr here too, so we can detect if linting failed:
      - name: Lint lexicon files
        id: lint
        run: |
          goat lex lint --json | jq --slurp | tee logs/lint.json

      - name: Check for lint errors
        id: lint-errors
        continue-on-error: true
        run: |
          hasErrors=$(jq 'any(."lint-level" | contains("error"))' logs/lint.json)
          if [ "$hasErrors" = "true" ]; then
            exit 1
          fi

      # We capture stderr here too, as warnings can be issues:
      - name: Check lexicon files for breaking changes
        id: breaking
        continue-on-error: true
        run: |
          set -eo pipefail
          goat lex breaking 2>&1 | tee logs/breaking-changes.txt

      - name: Check for dns records for lexicon
        id: dns
        continue-on-error: true
        env:
          DID: ${{ vars.DID }}
        run: |
          set -eo pipefail
          goat lex check-dns --example-did $DID | tee logs/check-dns.txt

      # Hand the PR number and completion flag to the privileged comment
      # workflow (comment.yml) via the artifact. This workflow runs without a
      # write token, so it cannot comment on the pull request itself.
      # FINISHED must stay identical to `jobs.check.outputs.finished` above
      # (job outputs can't be read from within the same job).
      - name: Record metadata for comment workflow
        if: success() || failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINISHED: ${{ steps.lint.outcome == 'success' || steps.lint.outcome == 'failure' || steps.breaking.outcome == 'success' || steps.breaking.outcome == 'failure' || steps.breaking.outcome == 'success' || steps.breaking.outcome == 'failure' }}
        run: |
          mkdir -p logs
          printf '%s\n' "$PR_NUMBER" > logs/pr-number
          printf '%s\n' "$FINISHED" > logs/finished

      - name: Upload check results
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: check-logs
          path: logs

      - name: Report on failures
        if: steps.lint-errors.outcome != 'success' || steps.breaking.outcome != 'success' || steps.dns.outcome != 'success'
        run: exit 1
